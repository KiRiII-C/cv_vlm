name: YOLOE-26 12-class RGB-D semantic mapping and temporal tracker
on:
  push:
    branches: [feature/semantic-memory-mapping]
    paths:
      - .github/workflows/yoloe26-rgbd-smoke.yml
      - src/semantic_map/yoloe26_detector.py
      - src/semantic_map/tum_yolo_pipeline.py
      - src/semantic_map/object_memory_v2.py
      - src/semantic_map/object_surface_memory_v2.py
      - config/yoloe26_classes.json
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: yoloe26-rgbd-smoke
  cancel-in-progress: true
jobs:
  yoloe26-real-rgbd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official YOLOE text prompt runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' 'ultralytics>=8.4.12' matplotlib plotly
      - name: Check official 12-class YOLOE-26s, RGB-D temporal tracking and persistent 3D UUID
        shell: bash
        run: |
          set -Eeuo pipefail
          python -u -m semantic_map.tum_yolo_pipeline \
            --data "$RUNNER_TEMP/tum" --output results/yoloe26_12classes_rgbd \
            --model yoloe-26s-seg.pt --classes-json config/yoloe26_classes.json \
            --conf .23 --max-frames 40 --device cpu --appearance hsv_spatial \
            --memory-engine v2 --persist-object-surfaces | tee yoloe26.log
      - name: Acceptance is pipeline smoke, NOT GT physical instance ID accuracy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/yoloe26_12classes_rgbd/real_mapping_report.json').read_text())
          assert r['frames']==40,r
          assert r['model']=='yoloe-26s-seg.pt',r
          assert r['temporal_enabled'] is True,r
          assert r['memory_engine']=='v2',r
          assert r['persistent_instance_surface_map']['vertices']>0,r
          assert r['object_memory_v2']['confirmed_query'],r
          assert len(r['configured_classes'])==12,r
          assert r['detections']>0 and r['confirmed_tracks']>0,r
          assert r['identity_gt_available'] is False,r
          print('YOLOE26_MODEL_RUNTIME_AND_3D_TEMPORAL_MAP_SMOKE_PASS',
                r['detections'],r['confirmed_tracks'],r['temporal_statuses'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yoloe26-12class-tum-multicue-candidate
          path: |
            results/yoloe26_12classes_rgbd/
            yoloe26.log
          retention-days: 30
          if-no-files-found: warn
