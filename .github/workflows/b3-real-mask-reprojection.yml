name: B3 full real TUM depth-verified reprojection ablation
on:
  push:
    branches:
      - experiments/rtabmap-geometry-a0-20261031
    paths:
      - .github/workflows/b3-real-mask-reprojection.yml
      - scripts/b3_full_tum_projective_mask_ablation.py
      - src/semantic_map/projective_association_b3.py
      - tests/test_projective_association_b3.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  b3-reprojection:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: a6-full-tum-graph-geometric-evidence
          run-id: 41444730029
          github-token: ${{ github.token }}
          path: .
      - name: Install official YOLOE-26s and run geometry tests
        run: |
          set -euo pipefail
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' 'ultralytics>=8.4.12'
          python -m pytest -q tests/test_projective_association_b3.py \
            tests/test_shared_rgbd_geometry_b.py tests/test_short_term_semantics_b.py
      - name: Run all 595 real depth frames and 119 real YOLOE mask frames, ablate density and splatting
        run: |
          set -euo pipefail
          export PYTHONPATH="src:scripts"
          python -u scripts/b3_full_tum_projective_mask_ablation.py \
            --data data/tum --poses results/a6/optimized_full_poses.json \
            --out results/b3 --weights yoloe-26s-seg.pt \
            --device cpu --stride 5 2>&1 | tee b3_full_tum.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/b3/b3_full_tum_report.json").read_text())
          rows=Path("results/b3/b3_frame_coverage.jsonl").read_text().splitlines()
          assert d["counts"]["rgbd_frames_processed"]==len(rows)==595
          assert d["counts"]["detector_keyframes"]==119
          assert d["counts"]["3d_observations"]>500
          assert d["accepted_short_track_pairs"]>=100
          assert set(d["ablation"])=={"sparse_0","sparse_1","dense_0","dense_1"}
          assert all(d["ablation"][name]["iou"]["n"]>50 for name in d["ablation"])
          assert d["ground_truth_used_for_pose"] is False
          assert d["ablation_ground_truth_physical_ID_evaluated"] is False
          print("B3_FULL_MASK_ABLATION_COMPLETE",{
            k:{"n":v["iou"]["n"],"median_iou":v["iou"]["median"],
               "median_precision":v["precision"]["median"],
               "mean_runtime_ms":v["runtime_ms"]["mean"]}
            for k,v in d["ablation"].items()},flush=True)
          PY
      - name: Save B3 full-frame reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b3-real-TUM-YOLOE26s-dense-reprojection
          path: |
            results/b3/
            b3_full_tum.log
          if-no-files-found: warn
          retention-days: 30
