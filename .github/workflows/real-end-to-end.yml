name: End-to-end real RGB-D semantic map and operator goal evaluation
on:
  push:
    branches: [feature/semantic-memory-mapping]
    paths:
      - src/semantic_map/operator_e2e.py
      - src/semantic_map/tum_yolo_pipeline.py
      - src/semantic_map/vlm_enrich.py
      - src/semantic_map/floor_alignment.py
      - src/semantic_map/offline_reconcile.py
      - .github/workflows/real-end-to-end.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install CPU perception plus geometry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1 libgomp1
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' 'open3d==0.19.0' ultralytics matplotlib plotly
      - name: Estimate all camera poses from RGB-D, no benchmark trajectory as input
        run: |
          set -o pipefail
          python -u -m semantic_map.visual_odometry             --data "$RUNNER_TEMP/tum" --output results/vo_mapping | tee vo.log
      - name: Optimize verified loop closures without GT
        run: |
          set -o pipefail
          python -u -m semantic_map.pose_graph             --poses results/vo_mapping/estimated_poses.json             --vo results/vo_mapping/vo_evaluation.json             --out results/vo_mapping --data "$RUNNER_TEMP/tum" | tee posegraph.log
      - name: All-frame RGB-D geometric map using independently estimated corrected camera poses
        run: |
          set -o pipefail
          python -u -m semantic_map.offline_mapping \
            --dataset "$RUNNER_TEMP/tum" --output results/full_geometry \
            --max-frames 0 --voxel .06 --tsdf-side 320 \
            --pose-json results/vo_mapping/optimized_poses.json | tee geometry.log
      - name: Gravity-aligned 2D free/occupied map from reconstructed RGB-D geometry
        run: |
          set -o pipefail
          OMP_NUM_THREADS=3 python -u -m semantic_map.floor_alignment             --geometry results/full_geometry             --out results/gravity_map | tee gravity.log
      - name: All-frame real pretrained instance segmentation, global persistent object memory
        run: |
          set -o pipefail
          python -u -m semantic_map.tum_yolo_pipeline \
            --data "$RUNNER_TEMP/tum" --output results/tum_real \
            --model yolo11n-seg.pt --max-frames 0 \
            --pose-json results/vo_mapping/optimized_poses.json | tee semantic.log
          python -u -m semantic_map.offline_reconcile \
            --db results/tum_real/semantic_memory.sqlite \
            --out results/tum_real/reconciliation.json | tee reconciliation.log
          python -m semantic_map.visualize_real --root results/tum_real
          python -m semantic_map.replay_ablation --root results/tum_real
      - name: Ground real operator commands in real object map and occupancy evidence
        run: |
          set -o pipefail
          python -u -m semantic_map.operator_e2e \
            --memory results/tum_real --geometry results/full_geometry \
            --output results/operator_e2e             --gravity results/gravity_map | tee operator.log
      - name: Compact VLM descriptions of selected real RGB object crops (immutable IDs)
        run: |
          set -o pipefail
          python -m pip install 'transformers>=4.55,<6' pillow
          OMP_NUM_THREADS=3 python -u -m semantic_map.vlm_enrich             --root results/tum_real --out results/vlm_semantics             --max-objects 6 | tee vlm.log
      - name: End-to-end integrity and safety assertions, NOT an ID/SLAM/Nav2 accuracy claim
        run: |
          python - <<'PY'
          import json
          g=json.load(open('results/full_geometry/mapping_report.json'))
          m=json.load(open('results/tum_real/real_mapping_report.json'))
          p=json.load(open('results/operator_e2e/operator_e2e.json'))
          floor=json.load(open('results/gravity_map/gravity_report.json'))
          assert floor['floor_detection']=='PLAUSIBLE_PLANE',floor
          assert floor['inflated_traversable_cells']>10,floor
          vlm=json.load(open('results/vlm_semantics/vlm_semantics.json'))
          assert vlm['objects_described']>=3 and vlm['identity_changes']==0,vlm
          assert all(x['vlm_text'] for x in vlm['descriptions']),vlm
          v=json.load(open('results/vo_mapping/posegraph_evaluation.json'))
          assert not v['gt_used_in_optimization']
          assert v['optimizer_status']=='APPLIED',v
          assert v['nonlocal_loops_verified']>0
          assert g['frames_integrated']==m['frames']==p['frames_integrated']
          assert m['uses_reference_poses'] is False,m
          assert g['frames_integrated']>=500
          assert g['mesh_vertices']>=5000 and g['mesh_triangles']>=7500
          assert m['detections']>=100 and m['confirmed_tracks']>0
          recon=json.load(open('results/tum_real/reconciliation.json'))
          assert recon['post_track_count']<=recon['pre_track_count']
          assert all(x['operation'] in ('MERGED_WITH_ALIAS','REJECTED_CONFLICT') for x in recon['reconciliations'])
          assert p['unknown_cells_blocked'] and p['robot_actuation']=='NOT_EXECUTED'
          assert len(p['queries'])>=5
          assert all(q['status'] in ('planned','route_candidate_unvalidated_map','ambiguous','not_found','unresolved','unreachable') for q in p['queries'])
          assert all(q.get('nav2_goal_candidate_not_executed') is None for q in p['queries'] if q['status']!='planned')
          assert p['identity_verified_with_GT'] is False
          print('END_TO_END_PIPELINE_INTEGRITY_CHECK_PASS',g['frames_integrated'],m['detections'])
          print('CAVEAT: independent SLAM, physical ID stability, robot Nav2 control are NOT validated')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-rgbd-offline-e2e-candidate
          path: |
            results/vo_mapping/
            results/full_geometry/
            results/gravity_map/
            results/tum_real/
            results/operator_e2e/
            vo.log
            posegraph.log
            geometry.log
            gravity.log
            semantic.log
            reconciliation.log
            operator.log
            vlm.log
          retention-days: 30
          if-no-files-found: warn
