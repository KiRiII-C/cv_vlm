name: D4-M1 correct 25 heldout camera-depth metrics without repeating YOLOE
on:
  push:
    branches: [experiments/rtabmap-geometry-a0-20261031]
    paths:
      - scripts/d4_correct_camera_depth_audit.py
      - .github/workflows/d4-correct-depth-metrics.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  repair-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '3'
      PYTHONPATH: src:scripts
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only offline mesh analysis and selective original data dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<2' 'scipy>=1.12,<2' \
            open3d==0.19.0 matplotlib opencv-python-headless remotezip
          python -m py_compile scripts/d4_correct_camera_depth_audit.py scripts/d4_full_office0_map.py
          python -m unittest discover -s tests -p test_d4_full_replica.py -v
      - name: Retrieve completed original D4 full source RGB-D mesh and original depth metadata
        uses: actions/download-artifact@v4
        with:
          name: D4-FULL-2000-REPLICA-500-RGBD-TSDF-QUALITY
          run-id: 41644080592
          github-token: ${{ github.token }}
          path: original
      - name: Correct optical-z row-vector camera rotation and re-evaluate only 25 held-out source depth frames
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/d4_correct_camera_depth_audit.py \
            --original original --source data/d4m1 --out Docs/maps \
            --run 41644080592 2>&1 | tee d4_m1_corrected.log
          test -s Docs/maps/D4_full_office0_quality_results.md
          test -s Docs/maps/D4_corrected_raycast_diagnostics.png
          test -s Docs/maps/D4_office0_metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: D4-M1-VERIFIED-CAMERA-DEPTH-CORRECTION
          path: |
            Docs/maps/D4_*
            d4_m1_corrected.log
          retention-days: 30
          if-no-files-found: error
      - name: Commit corrected scientifically valid metrics and preserve original failure provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/maps/D4_*
          git commit -m 'D4-M1 supersede invalid camera-depth audit with corrected optical z'
          git fetch origin experiments/rtabmap-geometry-a0-20261031
          git rebase origin/experiments/rtabmap-geometry-a0-20261031
          git push origin HEAD:experiments/rtabmap-geometry-a0-20261031
