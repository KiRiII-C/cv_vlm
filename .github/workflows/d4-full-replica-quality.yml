name: D4 full original Replica office0 geometry quality
on:
  push:
    branches: [experiments/rtabmap-geometry-a0-20261031]
    paths:
      - scripts/d4_extract_full_replica.py
      - scripts/d4_full_office0_map.py
      - scripts/d4_publish_quality.py
      - tests/test_d4_full_replica.py
      - .github/workflows/d4-full-replica-quality.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  full-replica-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: src:scripts
      MPLBACKEND: 'Agg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YOLOE26x CPU, TSDF, selective remote ZIP, and scene evaluation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' 'ultralytics>=8.4.12' \
            'numpy>=1.26,<2' 'scipy>=1.12,<2' 'opencv-python-headless<4.12' \
            open3d==0.19.0 trimesh matplotlib plotly pillow remotezip
          python -m py_compile scripts/d4_extract_full_replica.py scripts/d4_full_office0_map.py scripts/d4_publish_quality.py
          python -m unittest discover -s tests -p test_d4_full_replica.py -v
      - name: Selectively extract authentic RGB-D from official 2000-frame office0 scene
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/d4_extract_full_replica.py --out data/d4 2>&1 | tee d4_download.log
          test -s data/d4/Replica/office0/traj.txt
          test -s data/d4/Replica/office0_mesh.ply
          test -s data/d4/d4_provenance.json
      - name: Build dense RGB-D TSDF on 500 source frames and YOLOE masks from 200 frames
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/d4_full_office0_map.py --source data/d4 --out results/d4 \
             --voxel .018 --max-depth 7. --confidence .30 \
             2>&1 | tee d4_reconstruction.log
      - name: Verify original source, 25 heldout raycast views, independent GT and actual meshes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/d4_publish_quality.py --results results/d4 \
             --out Docs/maps --run "$GITHUB_RUN_ID"
      - name: Archive full 3D models, raycast evidence and source logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D4-FULL-2000-REPLICA-500-RGBD-TSDF-QUALITY
          path: |
            results/d4/
            d4_download.log
            d4_reconstruction.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 5
      - name: Publish verified preview and evidence to research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docs/maps/D4_*
          git commit -m 'Publish D4 original complete Replica TSDF raycast quality audit'
          git fetch origin experiments/rtabmap-geometry-a0-20261031
          git rebase origin/experiments/rtabmap-geometry-a0-20261031
          git push origin HEAD:experiments/rtabmap-geometry-a0-20261031
