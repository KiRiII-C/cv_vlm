name: B1-X YOLOE-26x full TUM matched CPU comparison
on:
  push:
    branches:
      - experiments/rtabmap-geometry-a0-20261031
    paths:
      - .github/workflows/b1x-yoloe26x-full-tum.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  yoloe26x-full-sensor-stream:
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: a6-full-tum-graph-geometric-evidence
          run-id: 41444730029
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: b1x-full-TUM-YOLOE26x-short-tracking
          run-id: 41456143947
          github-token: ${{ github.token }}
          path: .
      - name: Install PyTorch CPU and official YOLOE runtime
        run: |
          set -euo pipefail
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' 'ultralytics>=8.4.12'
          python -m pytest -q tests/test_shared_rgbd_geometry_b.py \
            tests/test_short_term_semantics_b.py \
            tests/test_yoloe26_temporal.py
      - name: Run full real 595-frame sensor pipeline (YOLOE every fifth keyframe)
        run: |
          set -euo pipefail
          export PYTHONPATH="src:scripts"
          python -u scripts/b1_yoloe_full_tum.py \
            --data data/tum --poses results/a6/optimized_full_poses.json \
            --out results/b1x --weights yoloe-26x-seg.pt \
            --device cpu --stride 5 2>&1 | tee b1x_full_tum.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/b1x/b1_full_tum_report.json").read_text())
          frames=[json.loads(l) for l in Path("results/b1x/b1_frame_coverage.jsonl").read_text().splitlines()]
          assert d["counts"]["rgbd_frames_processed"]==len(frames)==595
          assert d["counts"]["frames_without_pose"]==1
          assert d["counts"]["detector_keyframes"]>=115
          assert d["counts"]["3d_observations"]>0
          assert d["ground_truth_used_for_pose"] is False
          assert d["all_depth_frames_geometry_processed"] is True
          assert d["all_depth_frames_detected"] is False
          assert d["GT_physical_instance_ID_available"] is False
          print("B1X_FULL_TUM_TECHNICAL_PASS",d["counts"],flush=True)
          PY
      - name: Compare same TUM keyframes and 3D object observations: YOLOE-26s vs 26x
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("results/b1/b1_full_tum_report.json").read_text())
          b=json.loads(Path("results/b1x/b1_full_tum_report.json").read_text())
          assert a["YOLOE_weights"]=="yoloe-26s-seg.pt"
          assert b["YOLOE_weights"]=="yoloe-26x-seg.pt"
          assert a["class_prompts"]==b["class_prompts"]
          assert a["inference_every_nth_frame"]==b["inference_every_nth_frame"]==5
          assert a["counts"]["rgbd_frames_processed"]==b["counts"]["rgbd_frames_processed"]==595
          assert a["counts"]["detector_keyframes"]==b["counts"]["detector_keyframes"]==119
          report={"experiment":"B1_EXACT_SAME_FRAMES_YOLOE26S_VS_26X_CPU",
             "frames_full":595,"keyframes":119,
             "measured_geometry":"A6_RTABMap_optimized_full_poses",
             "compare_precision":"NOT_WITHOUT_PHYSICAL_GT",
             "baseline_s":{"masks":a["counts"]["YOLOE_masks_raw"],
                           "observations":a["counts"]["3d_observations"],
                           "short_tracklets":a["unique_short_tracklets_created"],
                           "detection_ms_mean":a["timings"]["detection_ms"]["mean_ms"],
                           "detection_ms_p95":a["timings"]["detection_ms"]["p95_ms"]},
             "model_x":{"masks":b["counts"]["YOLOE_masks_raw"],
                        "observations":b["counts"]["3d_observations"],
                        "short_tracklets":b["unique_short_tracklets_created"],
                        "detection_ms_mean":b["timings"]["detection_ms"]["mean_ms"],
                        "detection_ms_p95":b["timings"]["detection_ms"]["p95_ms"]},
             "source_masks_are_real":True,
             "runtime_is_cpu_not_target_rtx4060_trt":True}
          Path("results/b1x/b1x_vs_s.json").write_text(json.dumps(report,indent=2)+"\n")
          print("B1X_VS_S",report,flush=True)
          PY

      - name: Upload YOLO masks, 3D object and track evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-full-TUM-YOLOE3D-short-tracking
          path: |
            results/b1x/
            b1x_full_tum.log
          if-no-files-found: warn
          retention-days: 30
