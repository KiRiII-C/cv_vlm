name: Semantic memory CI (CPU)
on:
  push:
    branches: [feature/semantic-memory-mapping]
    paths:
      - 'src/semantic_map/**'
      - 'tests/**'
      - 'scripts/run_offline_e2e.sh'
      - 'pyproject.toml'
      - '.github/workflows/semantic-memory-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline
        run: python -m pip install -e '.[test]'
      - name: Validate local end-to-end bash command syntax
        run: bash -n scripts/run_offline_e2e.sh
      - name: Validate persistence, re-identification, geometry and ambiguous matching
        run: pytest -q tests/
      - name: Re-entry simulation using RGB-D backprojection
        run: python -m semantic_map.demo --db "$RUNNER_TEMP/semantic_memory.sqlite"
