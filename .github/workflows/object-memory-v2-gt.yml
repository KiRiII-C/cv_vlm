name: Persistent Object Memory V2 physical identity GT fixed-input ablation
on:
  push:
    branches: [feature/semantic-memory-mapping]
    paths: [.github/workflows/object-memory-v2-gt.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: object-memory-v2-physical-gt
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scene: ai_002_001, data: diverse, mode: oracle_masks, memory: legacy, max_objects: 60}
          - {scene: ai_002_001, data: diverse, mode: oracle_masks, memory: v2, max_objects: 60}
          - {scene: ai_002_001, data: diverse, mode: predicted_yolo_masks, memory: legacy, max_objects: 60}
          - {scene: ai_002_001, data: diverse, mode: predicted_yolo_masks, memory: v2, max_objects: 60}
          - {scene: ai_005_001, data: similar_chairs, mode: oracle_masks, memory: legacy, max_objects: 130}
          - {scene: ai_005_001, data: similar_chairs, mode: oracle_masks, memory: v2, max_objects: 130}
          - {scene: ai_005_001, data: similar_chairs, mode: predicted_yolo_masks, memory: legacy, max_objects: 130}
          - {scene: ai_005_001, data: similar_chairs, mode: predicted_yolo_masks, memory: v2, max_objects: 130}
    env:
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed YOLOE26 masks and GT evaluator
        run: |
          python -m pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,benchmark]' 'ultralytics>=8.4.12' h5py requests pillow
      - name: Evaluate V2 persistent memory vs baseline on identical physical GT source
        shell: bash
        run: |
          set -Eeuo pipefail
          python -u -m semantic_map.hypersim_instance_eval \
            --scene ${{ matrix.scene }} --max-objects ${{ matrix.max_objects }} \
            --mode ${{ matrix.mode }} --model yoloe-26s-seg.pt \
            --classes-json config/yoloe26_classes.json \
            --conf .23 --association fused --memory-engine ${{ matrix.memory }} \
            --out results/${{ matrix.data }}_${{ matrix.mode }}_${{ matrix.memory }} | tee instance_gt.log
      - name: Ground-truth integrity and acceptance is only completion of measurement
        env:
          RESULTS_DIR: results/${{ matrix.data }}_${{ matrix.mode }}_${{ matrix.memory }}
        run: |
          python - <<'PY'
          import os,json
          p=os.path.join(os.environ['RESULTS_DIR'],'hypersim_physical_id_gt.json')
          j=json.load(open(p))
          assert j['physical_gt_id_evaluation']=='YES'
          assert j['gt_is_physically_stable_across_frames']
          assert j['target_gt_unique_physical_ids']>=5
          assert j['target_vocabulary_gt']['gt_observations']>=20
          assert j['frames_evaluated']>=15
          assert j['object_memory_engine'] in ('v2','legacy')
          print('MEMORY_GT_RESULT',j['scene'],j['object_memory_engine'],j['mode'],
                'target_idf1',j['target_vocabulary_gt']['IDF1_observation_level'],
                'all_idf1',j['IDF1_observation_level'],
                'false_merges',j['false_merge_predicted_ids'],
                'false_splits',j['false_split_gt_objects'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-v2-gt-${{ matrix.data }}-${{ matrix.mode }}-${{ matrix.memory }}
          path: |
            results/${{ matrix.data }}_${{ matrix.mode }}_${{ matrix.memory }}/hypersim_physical_id_gt.json
            instance_gt.log
          retention-days: 30
          if-no-files-found: warn
  compare:
    if: always()
    needs: [identity]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: memory-v2-gt-*
          path: all_results
      - name: Compare exact physical GT measurements, never promote failed thresholds
        run: |
          python - <<'PY'
          import json,glob,pathlib
          rows=[]
          for file in glob.glob('all_results/**/hypersim_physical_id_gt.json',recursive=True):
            j=json.load(open(file))
            rows.append({'scene':j['scene'],'mode':j['mode'],'memory':j['object_memory_engine'],
              'gt_target_objects':j['target_gt_unique_physical_ids'],
              'gt_target_occurrences':j['target_vocabulary_gt']['gt_observations'],
              'idf1_target':j['target_vocabulary_gt']['IDF1_observation_level'],
              'idf1_all':j['IDF1_observation_level'],
              'false_splits':j['false_split_gt_objects'],
              'false_merges':j['false_merge_predicted_ids'],
              'reentry_pairs':j['observed_reentry_pairs_after_gap_4_frames'],
              'reentry_same_id':j['observed_reentry_same_uuid']})
          rows.sort(key=lambda x:(x['scene'],x['mode'],x['memory']))
          out={'provenance':'Hypersim physical instance GT, fixed YOLOE26s or oracle masks',
            'results':rows,'status':'MEASURED_NOT_ACCEPTED_AUTOMATICALLY',
            'caveat':'GT 3D coordinates used, excludes VO/SLAM and real-robot transfer'}
          pathlib.Path('memory_v2_comparison.json').write_text(json.dumps(out,indent=2))
          print('MEMORY_V2_GT_COMPARISON',json.dumps(rows))
          if len(rows)!=8:raise SystemExit('Incomplete 8-way ablation')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-v2-8mode-physical-id-summary
          path: memory_v2_comparison.json
          if-no-files-found: warn
