name: Fundamental RGB-D representation study
on:
  push:
    branches:
      - 'experiments/fundamental-spatial-representations-*'
    paths:
      - 'research/fundamental/**'
      - 'Docs/fundamental-research-20261102.md'
      - '.github/workflows/fundamental-representations.yml'
  pull_request:
    branches:
      - 'feature/semantic-memory-mapping'
  workflow_dispatch:
jobs:
  physical-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2'
      - name: Execute 1000 physically grounded pipelines
        run: python research/fundamental/experiment_1000.py
      - name: Verify count and artifacts
        run: |
          python - <<'PY'
          import csv, json
          path='results/fundamental/sweep1000.csv'
          with open(path) as f: rows=list(csv.DictReader(f))
          assert len(rows)==1000, len(rows)
          with open('results/fundamental/summary.json') as f: s=json.load(f)
          assert s['n_compositions']==1000
          assert s['n_scenes']>0
          print('PASS:',len(rows),'compositions;',s['n_scenes'],'scenes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fundamental-1000-rgbd-synthetic
          path: results/fundamental/
          retention-days: 30
