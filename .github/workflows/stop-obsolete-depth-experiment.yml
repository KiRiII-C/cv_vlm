name: Stop superseded end-to-end experiment runs
on:
  push:
    branches:
      - feature/semantic-memory-mapping
    paths:
      - .github/workflows/stop-obsolete-depth-experiment.yml
  workflow_dispatch:
permissions:
  actions: write
jobs:
  cancel-old-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete RGB-D depth-completion workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 40711988434 40712530083; do
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel"
          status=$(curl -sS -X POST -o /tmp/cancel-response.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$endpoint")
          echo "Cancellation HTTP status: $status"
          case "$status" in
            202) echo "Cancellation accepted by GitHub" ;;
            409) echo "Run is no longer cancellable (typically already completed)" ;;
            *) cat /tmp/cancel-response.json; exit 1 ;;
          esac
          done
