name: B2 physical GT short tracker full 300 Hypersim frames
on:
  push:
    branches:
      - experiments/rtabmap-geometry-a0-20261031
    paths:
      - scripts/b2_hypersim_short_track_gt.py
      - .github/workflows/b2-short-term-physical-gt.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  short-track-physical-gt:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve exact already-completed frozen YOLOE-26x full Hypersim predictions
        uses: actions/download-artifact@v4
        with:
          pattern: full-yoloe26x-100frames-*
          run-id: 40820074555
          github-token: ${{ github.token }}
          merge-multiple: true
          path: results/b2_inputs
      - name: Install CPU tracking evaluation dependencies
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_short_term_semantics_b.py tests/test_yoloe26_temporal.py
      - name: Evaluate each physical ID on ALL 300 source frame observations
        run: |
          set -euo pipefail
          python -u scripts/b2_hypersim_short_track_gt.py \
            --root results/b2_inputs --out results/b2 | tee b2_physical_tracking.log
          python - <<'PY'
          import json,math
          from pathlib import Path
          x=json.loads(Path("results/b2/b2_physical_gt_short_tracker.json").read_text())
          assert x["full_frames_processed"]==300
          assert len(x["per_scene"])==3
          for name,row in x["per_scene"].items():
              for setting,scope in row.items():
                  assert scope["frames"]==100
                  assert scope["GT_total_visible_instance_frames"]>0
                  assert 0<=scope["scores"]["IDF1"]<=1
          for scope in x["pooled"].values():
              assert math.isfinite(scope["pooled_IDF1"])
          assert x["GT_used_for_tracking"] is False
          assert x["mask_reprojection_evaluated"] is False
          print("B2_REAL_PHYSICAL_GT_COMPLETED",x["pooled"],flush=True)
          PY
      - name: Upload physical GT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-short-track-real-YOLOE26x-300-physical-GT
          path: |
            results/b2/
            b2_physical_tracking.log
          if-no-files-found: warn
          retention-days: 30
