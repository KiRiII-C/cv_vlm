name: Probe 3DMatch public RGBD-Scenes-v2 per-scene frames
on:
  push:
    branches: [feature/semantic-memory-mapping]
    paths: [.github/workflows/probe-3dmatch-rgbd.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scene-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent public RGB-D images for an annotated 3D scene
        run: |
          python - <<'PY'
          import urllib.request,re
          links=[
          'https://3dvision.princeton.edu/projects/2016/3DMatch/downloads/rgbd-datasets/rgbd-scenes-v2-scene_01.zip',
          'http://3dvision.princeton.edu/projects/2016/3DMatch/downloads/rgbd-datasets/rgbd-scenes-v2-scene_01.zip',
          'https://3dmatch.cs.princeton.edu/downloads/rgbd-datasets/rgbd-scenes-v2-scene_01.zip',
          'https://3dmatch.cs.princeton.edu/']
          for url in links:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'},method='HEAD')
                  with urllib.request.urlopen(req,timeout=12) as r:
                      print('RGBD_SOURCE',r.status,r.headers.get('content-length'),r.url,flush=True)
              except Exception as e:print('RGBD_SOURCE_UNAVAILABLE',url,repr(e),flush=True)
          PY
      - name: Download annotated-scene RGB-D video and inspect camera calibration
        run: |
          python - <<'PY'
          import urllib.request,zipfile
          from pathlib import Path
          url='https://3dvision.princeton.edu/projects/2016/3DMatch/downloads/rgbd-datasets/rgbd-scenes-v2-scene_11.zip'
          dst=Path('/tmp/rgbd-scenes-v2-scene_11.zip')
          urllib.request.urlretrieve(url,dst)
          with zipfile.ZipFile(dst) as z:
              names=z.namelist()
              print('RGBD_FRAME_ARCHIVE',dst.stat().st_size,len(names),names[:28],flush=True)
              selected=[n for n in names if n.endswith(('.txt','.pose.txt'))]
              for name in selected[:5]:
                  if name.count('/')<4:
                      print('RGBD_CALIBRATION',name,z.read(name)[:700].decode('utf-8','replace'),flush=True)
              print('FRAMES_RGB',sum(x.endswith('.color.png') for x in names),
                    'FRAMES_DEPTH',sum(x.endswith('.depth.png') for x in names),
                    'POSES',sum(x.endswith('.pose.txt') for x in names),flush=True)
          PY
