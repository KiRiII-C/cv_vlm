[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory-mapping"
version = "0.1.0"
description = "Offline RGB-D instance mapping with persistent semantic object identities"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
rgbd = ["opencv-python-headless>=4.8"]
test = ["pytest>=8", "opencv-python-headless>=4.8", "scikit-learn>=1.4"]
benchmark = ["scikit-learn>=1.4", "plotly>=5.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
